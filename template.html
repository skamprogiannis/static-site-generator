<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15151b">
    <meta
      name="description"
      content="A dependency-free Python static site generator demonstrated through its own output."
    >
    <title>{{ Title }}</title>
    <link rel="icon" href="{{ BasePath }}favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{ BasePath }}styles.css">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="{{ BasePath }}index.html" aria-label="Static Site Generator home">
        <span aria-hidden="true">&lt;/&gt;</span>
        Plaintext Press
      </a>
      <nav aria-label="Primary navigation">
        <a href="#content">Demo</a>
        <a href="https://github.com/skamprogiannis/static-site-generator">Source</a>
      </nav>
    </header>
    <main id="content">
      {{ Content }}
    </main>
    <footer>
      <p>Built with Python, Markdown, and no runtime dependencies.</p>
      <a href="#content">Back to top</a>
    </footer>
  </body>
</html>
