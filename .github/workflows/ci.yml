name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s src -v

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Exercise a production build
        run: python src/main.py --output /tmp/static-site-generator-build

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build site for GitHub Pages
        run: python src/main.py --base-path /static-site-generator/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
